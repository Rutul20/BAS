<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BAS Grading Authority | Preserve. Authenticate. Grade.</title>
    <meta name="description" content="BAS Grading Authority - Premier collectible card authentication, rigorous 10-point condition analysis, and museum-grade archival sonic encapsulation." />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="BAS Grading Authority - Preserve. Authenticate. Grade." />
    <meta property="og:description" content="Independent collectible card authentication, 10-point scale standards, and archival sonic encasement by BAS Grading Authority." />
    <meta property="og:type" content="website" />

    <!-- Fonts: Plus Jakarta Sans for bold modern grotesque headers & Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Favicon - Synchronized with Brand Shield -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Single Page App routing support for GitHub Pages -->
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-white text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
